project:
  type: book
  output-dir: _book
  # Mirrors references.bib to the Better BibTeX auto-export at
  # ~/Documents/bibs/zotero.bib for every cited key: appends what is missing,
  # refreshes what Zotero has changed, and leaves everything else byte-for-byte
  # (including this book's large legacy bib, inherited from ent_analytics).
  # Absent master (CI, fresh clone) => notice and exit 0. Same script as
  # Expeditionary Innovation. See scripts/sync-refs.py.
  pre-render:
    - scripts/sync-refs.py
  # Netlify reads _headers from the root of the deployed directory, and the
  # workflow deploys _book/. _book/ is gitignored and rebuilt on the runner,
  # so the file cannot simply be committed there — Quarto has to copy it in.
  # It stops the edge serving a stale page; the comments in _headers explain
  # what went wrong and why Cache-Control alone was not enough.
  resources:
    - _headers

book:
  title: "Is This Worth Doing?"
  subtitle: "How to Evaluate Profit Before Revenue Exists"  
#  author: "Nile Hatch"  
#  date: "1/1/2026"
  reader-mode: true
  site-url: https://ea.nilehatch.com/
  repo-url: https://github.com/nilehatch/ent_analytics/

  page-footer:
    left: |
       _Is This Worth Doing?_ was written by Nile Hatch (2026).
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.

  sidebar:
    style: "docked"   # or "floating"
    collapse-level: 1
    

## from ent analytics version
#  navbar:
#    background: primary
#    search: true
#  reader-mode: true

  page-navigation: true
  bread-crumbs: true
  search: true

  
  chapters:
    - index.qmd

    # worth-doing stands outside the parts, matching Make the Call's intro.qmd
    # and EI's opening chapter. It is an introductory chapter in substance and
    # was the only one of the three books' openers sitting inside a part.
    # It is also UNNUMBERED, made so on 17 Aug 2026 because it was the only
    # front-matter chapter in the family carrying a number in the nav bar. That
    # renumbered the book once, deliberately: familiar-tools became ch1 and
    # everything shifted down one. Notes written before that date carry the old
    # numbers, one higher.
    - worth-doing.qmd

    - part: Pre-Revenue Decisions
      chapters:
        - familiar-tools.qmd
        - what-to-learn.qmd

    - part: Demand
      chapters:
        - what-demand-is.qmd
        - designing-experiments.qmd
        - executing-experiments.qmd
        - estimating-demand.qmd

    # The two Toolkit Parts and competition-survey.qmd were deleted 20 Aug 2026,
    # ten files plus their two openers, ~11,700 words. They were never a
    # procedure: measured 17 Aug, the 29 chapters carried 1,163 executable lines
    # and the 10 toolkits carried 0. They asked the reader to understand a
    # process and then invent it for their own case, which is the hybrid ChatGPT
    # pushed the first draft into. The two method layers below now carry the
    # mechanics, in a form a machine can actually execute, and the judgment they
    # gestured at is in the chapters' .threshold gates -- eleven of them as of
    # 20 Aug, one for every stage where the layer hands back. Deleted before the
    # semester rather than after it, since no student had seen them yet and
    # shipping both in parallel would have been the confusing outcome.
    #
    # Not lost in the deletion: the three-anchor elicitation and the
    # four-scenario competitive design (the book's two unplaced contributions)
    # are specified in the layers; replication against a fresh sample moved into
    # estimating-demand; frame-the-problem's six framing items were already
    # Stage 0 and are now also the gate in what-to-learn.

    - part: Profit
      chapters:
        - cost.qmd
        - scale.qmd
        - profit.qmd
        - profit-reasoning.qmd

    - part: Competition
      chapters:
        - competition.qmd
        - differentiated-competition.qmd
        - competition-experiment.qmd
        - competitive-advantage.qmd
        
    # One part, not two. Until 16 Aug 2026 the TOC carried a bare
    # "Competitive Dynamics" part holding non-price-competition AND a second
    # part keyed to part-competitive-dynamics.qmd holding the four legacy
    # game-theory files. That was one unfinished migration showing as two
    # parts. Merged here; the four legacy files collapse into three chapters
    # as they are rewritten.
    #
    # The opener file was retired 17 Aug 2026, the last of the narrative part
    # openers to go. It still described the pre-rewrite structure — it named
    # Strategic Commitment as a fourth chapter, and that file no longer exists
    # — and everything it claimed was already in the chapters. A bare title
    # now, matching the other four narrative parts. The two toolkit openers
    # remain and go when the toolkits dissolve.
    - part: "Competition Before Price"
      chapters:
        - non-price-competition.qmd
        - game-theory.qmd
        - simultaneous-games.qmd        
        - sequential-games.qmd
    # The sign-off, unparted and unnumbered. Not a recap — the chapters do that
    # twice already, in ch11's "Is This Worth Doing?" and at the end of ch19.
    # Its job is the three things the preface promises the reader will know when
    # they commit (what you are betting on, how much of it you checked, what
    # would make you wrong), which the book delivers in pieces and never
    # assembles, plus the handoff to Make the Call. The arc and the title
    # question moved here from ch19 on 17 Aug 2026; ch19 kept the filter and
    # the "not yet" point, both of which belong to commitment specifically.
    - what-its-worth.qmd

    # The method layer, unnumbered like the sign-off. Two files by design: this
    # one runs the single-firm pipeline (stages 0-7), and the competitive branch
    # gets its own layer, because a reader who is not facing a rival should not
    # have to page past it. prose-check exempts both — a different register, per
    # family style guide S3.
    - method-layer.qmd
    - method-layer-competition.qmd

    # Removed 11 Aug 2026, both pending real content:
    #   - part: Competing to Sell to Businesses   (part had no chapters; rendered empty)
    #   - summary.qmd                             (placeholder: "this book has no content
    #                                              whatsoever" — was live as ch. 24)
    # summary.qmd is superseded by what-its-worth.qmd and can be deleted.
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - itwd.scss   # Bootstrap variables: nav highlights, links, focus rings
#    include-after-body: collapse-parts.html
    css:
      - base.css
      - custom_itwd.css
    number-sections: true
    # Depth 1 numbers chapters only, never sections — matching Expeditionary
    # Innovation. Make the Call sets number-sections: false outright. At depth 2
    # this book was the family outlier, stamping 2.1 / 2.2 down every chapter.
    number-depth: 1
    fig-cap-location: margin
    tbl-cap-location: margin
#    embed-resources: true

editor: source

execute:
  echo: false
  warning: false
  error: false
  # Freeze R chunk results so CI never needs R installed. Twenty-two documents
  # in this book carry R chunks; the GitHub runner has no R and no tidyverse.
  #
  # `auto`, NOT `true`. With `true`, Quarto never re-executes during a project
  # render, so edits to a chunk are silently ignored and the stale frozen
  # markdown ships instead. `auto` re-executes only when the source actually
  # changes, which is what we want locally.
  #
  # Commit _freeze/ after any render that touches a document with code. If the
  # freeze is out of date, CI FAILS LOUDLY rather than quietly publishing
  # stale content. Same setting and same reasoning as Expeditionary Innovation.
  freeze: auto