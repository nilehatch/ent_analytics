bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - itwd.scss   # Bootstrap variables: nav highlights, links, focus rings
#    include-after-body: collapse-parts.html
    css:
      - base.css
      - custom_itwd.css
    number-sections: true
    # Depth 1 numbers chapters only, never sections — matching Expeditionary
    # Innovation. Make the Call sets number-sections: false outright. At depth 2
    # this book was the family outlier, stamping 2.1 / 2.2 down every chapter.
    number-depth: 1
    fig-cap-location: margin
    tbl-cap-location: margin
#    embed-resources: true

editor: source

execute:
  echo: false
  warning: false
  error: false
  # Freeze R chunk results so CI never needs R installed. Twenty-two documents
  # in this book carry R chunks; the GitHub runner has no R and no tidyverse.
  #
  # `auto`, NOT `true`. With `true`, Quarto never re-executes during a project
  # render, so edits to a chunk are silently ignored and the stale frozen
  # markdown ships instead. `auto` re-executes only when the source actually
  # changes, which is what we want locally.
  #
  # Commit _freeze/ after any render that touches a document with code. If the
  # freeze is out of date, CI FAILS LOUDLY rather than quietly publishing
  # stale content. Same setting and same reasoning as Expeditionary Innovation.
  freeze: auto