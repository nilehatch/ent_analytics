project:
  type: book
  output-dir: _book
  # Mirrors references.bib to the Better BibTeX auto-export at
  # ~/Documents/bibs/zotero.bib for every cited key: appends what is missing,
  # refreshes what Zotero has changed, and leaves everything else byte-for-byte
  # (including this book's large legacy bib, inherited from ent_analytics).
  # Absent master (CI, fresh clone) => notice and exit 0. Same script as
  # Expeditionary Innovation. See scripts/sync-refs.py.
  pre-render:
    - scripts/sync-refs.py
  # Netlify reads _headers from the root of the deployed directory, and the
  # workflow deploys _book/. _book/ is gitignored and rebuilt on the runner,
  # so the file cannot simply be committed there — Quarto has to copy it in.
  # It stops the edge serving a stale page; the comments in _headers explain
  # what went wrong and why Cache-Control alone was not enough.
  resources:
    - _headers

